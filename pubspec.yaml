name: naka
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: # Added for internationalization
    sdk: flutter

  # UI & State
  flutter_riverpod: ^2.5.1 # Best modern state management
  go_router: ^13.0.0 # Clean navigation system
  hooks_riverpod: ^2.5.1 # Optional: Flutter hooks with Riverpod
  provider: ^6.1.5 # For appearance settings

  # UI Utilities
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0 # For loading placeholders
  intl: ^0.20.2 # Updated to match flutter_localizations requirement
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  # Core functionality
  cupertino_icons: ^1.0.8
  google_maps_flutter: ^2.12.3
  location: ^5.0.3
  image_picker: ^0.8.6
  flutter_native_splash: ^2.3.10
  fl_chart: ^0.68.0 # For charts and graphs
  flutter_tts: ^4.2.5 # Text-to-speech for accessibility
  translator: ^1.0.4+1 # For translating text content
  # Added dependencies for language support
  shared_preferences: ^2.2.2 # For storing user language preference
  sms_autofill: ^2.4.0 # For reading device phone number hint

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  generate: true # Added for internationalization code generation
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_native_splash:
  color: "#ffffff"
  image: assets/logo.png
  android: true
  ios: true
